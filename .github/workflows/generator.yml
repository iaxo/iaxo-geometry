name: Geometry Generator

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  generator:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Run geometry generator
        working-directory: ${{github.workspace}}/generator
        run: |
          chmod +x gradlew
          ./gradlew run

      - name: Check generated GDML and variant regressions
        run: python3 tests/check_gdml.py --generated generator/gdml

      - name: List geometry files
        run: |
          ls -lht ${{github.workspace}}/gdml
